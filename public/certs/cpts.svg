<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="cpts-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1438" />
      <stop offset="50%" stop-color="#110d24" />
      <stop offset="100%" stop-color="#090614" />
    </linearGradient>
    <linearGradient id="cpts-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#9fef00" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="cpts-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#a855f7" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Outer Hexagon -->
  <polygon points="60,6 108,32 108,88 60,114 12,88 12,32" fill="url(#cpts-grad)" stroke="url(#cpts-border)" stroke-width="3" filter="url(#cpts-glow)"/>
  
  <!-- Inner Ring -->
  <polygon points="60,14 100,36 100,84 60,106 20,84 20,36" fill="none" stroke="#9fef00" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- Hack The Box Isometric Cube -->
  <g transform="translate(60, 48) scale(1.1)">
    <!-- Top Face -->
    <polygon points="0,-16 14,-8 0,0 -14,-8" fill="#9fef00" />
    <!-- Left Face -->
    <polygon points="-14,-8 0,0 0,16 -14,8" fill="#7ab800" />
    <!-- Right Face -->
    <polygon points="0,0 14,-8 14,8 0,16" fill="#588500" />
  </g>

  <!-- Title Text -->
  <text x="60" y="92" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="900" fill="#ffffff" letter-spacing="1">CPTS</text>
  <text x="60" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="6.5" font-weight="700" fill="#c084fc" letter-spacing="0.5">HTB ACADEMY</text>
</svg>
