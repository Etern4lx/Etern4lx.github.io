<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="ewptx-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be123c" />
      <stop offset="50%" stop-color="#881337" />
      <stop offset="100%" stop-color="#14060b" />
    </linearGradient>
    <linearGradient id="ewptx-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="ewptx-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#f43f5e" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Outer Hexagon -->
  <polygon points="60,6 108,32 108,88 60,114 12,88 12,32" fill="url(#ewptx-grad)" stroke="url(#ewptx-border)" stroke-width="3" filter="url(#ewptx-glow)"/>
  
  <!-- Inner Ring -->
  <polygon points="60,14 100,36 100,84 60,106 20,84 20,36" fill="none" stroke="#fb7185" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- Web Globe / Terminal Icon -->
  <circle cx="60" cy="50" r="16" fill="#4c0519" stroke="#fb7185" stroke-width="1.5" />
  <ellipse cx="60" cy="50" rx="7" ry="16" fill="none" stroke="#fda4af" stroke-width="1" opacity="0.8"/>
  <line x1="44" y1="50" x2="76" y2="50" stroke="#fda4af" stroke-width="1" opacity="0.8"/>
  
  <!-- Bug / Exploit Accent -->
  <path d="M56 46 L64 54 M64 46 L56 54" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Title Text -->
  <text x="60" y="92" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="900" fill="#ffffff" letter-spacing="1">eWPTX</text>
  <text x="60" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="6.5" font-weight="700" fill="#fecdd3" letter-spacing="0.5">WEB EXTREME</text>
</svg>
