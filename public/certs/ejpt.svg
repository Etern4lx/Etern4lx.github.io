<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="ejpt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="ejpt-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="ejpt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Outer Hexagon -->
  <polygon points="60,6 108,32 108,88 60,114 12,88 12,32" fill="url(#ejpt-grad)" stroke="url(#ejpt-border)" stroke-width="3" filter="url(#ejpt-glow)"/>
  
  <!-- Inner Ring -->
  <polygon points="60,14 100,36 100,84 60,106 20,84 20,36" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- Shield Icon -->
  <path d="M60 26 L76 33 V50 C76 62 69 71 60 76 C51 71 44 62 44 50 V33 Z" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>
  
  <!-- Checkmark inside Shield -->
  <path d="M53 50 L58 55 L68 44" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Title Text -->
  <text x="60" y="92" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="900" fill="#ffffff" letter-spacing="1">eJPTv2</text>
  <text x="60" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="6.5" font-weight="700" fill="#7dd3fc" letter-spacing="0.5">INE SECURITY</text>
</svg>
