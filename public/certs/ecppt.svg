<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="ecppt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#0f0920" />
    </linearGradient>
    <linearGradient id="ecppt-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="ecppt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#a855f7" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Outer Hexagon -->
  <polygon points="60,6 108,32 108,88 60,114 12,88 12,32" fill="url(#ecppt-grad)" stroke="url(#ecppt-border)" stroke-width="3" filter="url(#ecppt-glow)"/>
  
  <!-- Inner Ring -->
  <polygon points="60,14 100,36 100,84 60,106 20,84 20,36" fill="none" stroke="#c084fc" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- Crosshair / Pentest Target Icon -->
  <circle cx="60" cy="50" r="16" fill="#581c87" stroke="#c084fc" stroke-width="1.5" />
  <circle cx="60" cy="50" r="9" fill="none" stroke="#e9d5ff" stroke-width="1.5" />
  <circle cx="60" cy="50" r="3" fill="#f43f5e" />
  <line x1="60" y1="30" x2="60" y2="39" stroke="#c084fc" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="61" x2="60" y2="70" stroke="#c084fc" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="50" x2="49" y2="50" stroke="#c084fc" stroke-width="2" stroke-linecap="round"/>
  <line x1="71" y1="50" x2="80" y2="50" stroke="#c084fc" stroke-width="2" stroke-linecap="round"/>

  <!-- Title Text -->
  <text x="60" y="92" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="900" fill="#ffffff" letter-spacing="1">eCPPT</text>
  <text x="60" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="6.5" font-weight="700" fill="#d8b4fe" letter-spacing="0.5">INE SECURITY</text>
</svg>
