<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a10" />
      <stop offset="50%" stop-color="#0e0a1a" />
      <stop offset="100%" stop-color="#07070b" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(139, 92, 246, 0.08)" stroke-width="1"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="orb" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(139, 92, 246, 0.25)" />
      <stop offset="100%" stop-color="rgba(139, 92, 246, 0)" />
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f3e8ff" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(19, 13, 36, 0.85)" />
      <stop offset="100%" stop-color="rgba(10, 7, 20, 0.95)" />
    </linearGradient>
  </defs>

  <!-- Base background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#orb)" />

  <!-- Cyber frame borders -->
  <path d="M 40 80 L 40 40 L 80 40" stroke="#8b5cf6" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M 1160 80 L 1160 40 L 1120 40" stroke="#8b5cf6" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M 40 550 L 40 590 L 80 590" stroke="#8b5cf6" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M 1160 550 L 1160 590 L 1120 590" stroke="#8b5cf6" stroke-width="3" fill="none" opacity="0.8"/>

  <!-- Top bar status -->
  <text x="80" y="95" font-family="'Fira Code', monospace" font-size="16" fill="#8b5cf6" letter-spacing="3">// OFFENSIVE SECURITY RESEARCHER</text>
  <text x="1000" y="95" font-family="'Fira Code', monospace" font-size="16" fill="#4ade80" letter-spacing="1">● ONLINE</text>

  <!-- Main Left Content -->
  <g transform="translate(80, 160)">
    <!-- Subtitle / Greeting -->
    <text x="0" y="60" font-family="'Inter', sans-serif" font-weight="700" font-size="52" fill="#e2e8f0">Hola, soy</text>

    <!-- Name with Gradient & Glow -->
    <text x="0" y="145" font-family="'Inter', sans-serif" font-weight="800" font-size="82" fill="url(#textGrad)" filter="url(#glow)">Alvaro Martinez</text>

    <!-- Nick pill -->
    <g transform="translate(0, 185)">
      <rect width="210" height="42" rx="8" fill="rgba(139, 92, 246, 0.15)" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1.5" />
      <text x="18" y="27" font-family="'Fira Code', monospace" font-size="18" fill="#94a3b8">Nickname:</text>
      <text x="120" y="27" font-family="'Fira Code', monospace" font-weight="600" font-size="18" fill="#a78bfa">Etern4l</text>
    </g>

    <!-- Focus areas -->
    <g transform="translate(0, 260)">
      <text x="0" y="22" font-family="'Fira Code', monospace" font-size="20" fill="#4ade80">▶</text>
      <text x="26" y="22" font-family="'Fira Code', monospace" font-size="20" fill="#cbd5e1" letter-spacing="1">Pentesting · Red Team · Web Security</text>
    </g>

    <!-- Bottom tags -->
    <g transform="translate(0, 320)">
      <rect x="0" y="0" width="105" height="34" rx="6" fill="rgba(74, 222, 128, 0.1)" stroke="rgba(74, 222, 128, 0.3)" stroke-width="1" />
      <text x="20" y="23" font-family="'Fira Code', monospace" font-weight="600" font-size="16" fill="#4ade80">eJPTv2</text>

      <rect x="120" y="0" width="95" height="34" rx="6" fill="rgba(74, 222, 128, 0.1)" stroke="rgba(74, 222, 128, 0.3)" stroke-width="1" />
      <text x="140" y="23" font-family="'Fira Code', monospace" font-weight="600" font-size="16" fill="#4ade80">eCPPT</text>

      <rect x="230" y="0" width="95" height="34" rx="6" fill="rgba(74, 222, 128, 0.1)" stroke="rgba(74, 222, 128, 0.3)" stroke-width="1" />
      <text x="250" y="23" font-family="'Fira Code', monospace" font-weight="600" font-size="16" fill="#4ade80">eWPTX</text>

      <rect x="340" y="0" width="125" height="34" rx="6" fill="rgba(245, 158, 11, 0.1)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1" />
      <text x="355" y="23" font-family="'Fira Code', monospace" font-weight="600" font-size="16" fill="#f59e0b">CPTS 90%</text>
    </g>
  </g>

  <!-- Right Terminal Mockup -->
  <g transform="translate(730, 160)">
    <!-- Terminal window -->
    <rect width="390" height="320" rx="12" fill="#090912" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1.5" filter="url(#glow)"/>
    <rect width="390" height="38" rx="12" fill="rgba(139, 92, 246, 0.12)" />
    <line x1="0" y1="38" x2="390" y2="38" stroke="rgba(139, 92, 246, 0.2)" stroke-width="1" />

    <!-- Window buttons -->
    <circle cx="22" cy="19" r="6" fill="#ef4444" />
    <circle cx="42" cy="19" r="6" fill="#f59e0b" />
    <circle cx="62" cy="19" r="6" fill="#10b981" />
    <text x="82" y="24" font-family="'Fira Code', monospace" font-size="13" fill="#64748b">etern4l@kali:~</text>

    <!-- Terminal text -->
    <text x="24" y="80" font-family="'Fira Code', monospace" font-size="15" fill="#a78bfa">etern4l@kali</text>
    <text x="135" y="80" font-family="'Fira Code', monospace" font-size="15" fill="#64748b">~$</text>
    <text x="160" y="80" font-family="'Fira Code', monospace" font-size="15" fill="#e2e8f0">whoami</text>

    <text x="24" y="115" font-family="'Fira Code', monospace" font-weight="600" font-size="17" fill="#4ade80">Etern4l</text>
    <text x="24" y="142" font-family="'Fira Code', monospace" font-size="13" fill="#64748b">// Offensive Security</text>

    <text x="24" y="185" font-family="'Fira Code', monospace" font-size="15" fill="#a78bfa">etern4l@kali</text>
    <text x="135" y="185" font-family="'Fira Code', monospace" font-size="15" fill="#64748b">~$</text>
    <text x="160" y="185" font-family="'Fira Code', monospace" font-size="15" fill="#e2e8f0">./launch_community</text>

    <text x="24" y="220" font-family="'Fira Code', monospace" font-size="14" fill="#4ade80">[✓] StickyBit Community</text>
    <text x="24" y="246" font-family="'Fira Code', monospace" font-size="13" fill="#94a3b8">chat.stickybit.es</text>

    <!-- Cursor -->
    <rect x="24" y="275" width="10" height="18" fill="#a78bfa" opacity="0.8"/>
  </g>
</svg>
